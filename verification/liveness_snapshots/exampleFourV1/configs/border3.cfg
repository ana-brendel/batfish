
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname border3
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.0.0.3 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 2.23.11.3 255.255.255.0
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 2.23.21.3 255.255.255.0
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 2.34.101.3 255.255.255.0
 negotiation auto
!
router ospf 1
 router-id 10.0.0.3
 redistribute connected subnets
 network 2.1.0.0 0.0.255.255 area 1
 network 2.23.0.0 0.0.255.255 area 1
!
router bgp 2
 bgp router-id 10.0.0.3
 bgp log-neighbor-changes
 neighbor insiders peer-group
 neighbor insiders remote-as 2
 neighbor center peer-group
 neighbor center remote-as 2
 neighbor outsiders peer-group
 neighbor outsiders remote-as 65003
 neighbor 10.0.0.1 peer-group insiders
 neighbor 10.0.0.1 update-source Loopback0
 neighbor 10.0.0.2 peer-group insiders
 neighbor 10.0.0.2 update-source Loopback0
 neighbor 10.0.0.4 peer-group center
 neighbor 10.0.0.4 update-source Loopback0
 neighbor 100.0.0.3 peer-group outsiders
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  neighbor insiders send-community
  neighbor insiders route-map from_inside in
  neighbor center send-community
  neighbor outsiders send-community
  neighbor outsiders route-map from_entering in
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.4 activate
  neighbor 100.0.0.3 activate
  maximum-paths eibgp 5
 exit-address-family
!
ip forward-protocol nd
!
ip bgp-community new-format
!
no ip http server
no ip http secure-server
!
ip community-list check_communitiy permit 3:3
ip community-list flag_communitiy permit 30:30
!
ip prefix-list checked-prefixes seq 5 permit 10.0.0.0/8
!
route-map from_entering deny 100
 match community check_communitiy
!
route-map from_entering permit 200
 match ip address prefix-list checked-prefixes
 set community 30:30
!
route-map from_entering permit 300
!
route-map from_inside permit 100
 set community none
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end