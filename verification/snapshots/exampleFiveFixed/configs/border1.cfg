
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname border1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.0.0.1 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 2.23.11.3 255.255.255.0
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 2.23.21.3 255.255.255.0
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 2.34.101.3 255.255.255.0
 negotiation auto
!
router ospf 1
 router-id 10.0.0.1
 redistribute connected subnets
 network 2.1.0.0 0.0.255.255 area 1
 network 2.23.0.0 0.0.255.255 area 1
!
router bgp 2
 bgp router-id 10.0.0.1
 bgp log-neighbor-changes
 neighbor insiders peer-group
 neighbor insiders remote-as 2
 neighbor outsiders peer-group
 neighbor outsiders remote-as 65001
 neighbor 10.0.0.2 peer-group insiders
 neighbor 10.0.0.2 update-source Loopback0
 neighbor 100.0.0.1 peer-group outsiders
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  neighbor insiders send-community
  neighbor insiders route-map to_leaving out
  neighbor outsiders send-community
  neighbor outsiders route-map from_entering in
  neighbor 10.0.0.2 activate
  neighbor 100.0.0.1 activate
  maximum-paths eibgp 5
 exit-address-family
!
ip forward-protocol nd
!
ip bgp-community new-format
!
no ip http server
no ip http secure-server
!
ip community-list check_to_add permit 20:20
!
ip prefix-list checked-prefixes-1 seq 5 permit 2.4.0.0/16
ip prefix-list checked-prefixes-2 seq 5 permit 3.9.0.0/16
ip prefix-list checked-prefixes-3 seq 5 permit 4.16.0.0/16
ip prefix-list checked-prefixes-4 seq 5 permit 5.25.0.0/16
!
route-map from_entering permit 100
 match ip address prefix-list checked-prefixes-1
 set community 10:10
!
route-map from_entering permit 200
 match ip address prefix-list checked-prefixes-2
 set community 20:20
!
route-map from_entering permit 300
 match ip address prefix-list checked-prefixes-3
 set community 30:30
!
route-map from_entering permit 400
 match ip address prefix-list checked-prefixes-4
 set community 40:40
!
route-map from_entering permit 500
 set community none
!
route-map to_leaving permit 100
 match community check_to_add
 set community 50:50 additive
!
route-map to_leaving permit 200
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end