
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname center2
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.0.0.2 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 2.23.11.3 255.255.255.0
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 2.23.21.3 255.255.255.0
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 2.34.101.3 255.255.255.0
 negotiation auto
!
router ospf 1
 router-id 10.0.0.2
 redistribute connected subnets
 network 2.1.0.0 0.0.255.255 area 1
 network 2.23.0.0 0.0.255.255 area 1
!
router bgp 2
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 neighbor from_border peer-group
 neighbor from_border remote-as 2
 neighbor to_target peer-group
 neighbor to_target remote-as 2
 neighbor 10.0.0.1 peer-group from_border
 neighbor 10.0.0.1 update-source Loopback0
 neighbor 10.0.0.3 peer-group to_target
 neighbor 10.0.0.3 update-source Loopback0
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  neighbor from_border send-community
  neighbor to_target send-community
  neighbor to_target route-map leaving_to_target out
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.3 activate
  maximum-paths eibgp 5
 exit-address-family
!
ip forward-protocol nd
!
ip bgp-community new-format
!
no ip http server
no ip http secure-server
!
!
route-map leaving_to_target permit 100
 set community none
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end