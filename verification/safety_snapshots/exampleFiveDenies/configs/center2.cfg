
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname center2
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.0.0.2 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 2.23.11.3 255.255.255.0
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 2.23.21.3 255.255.255.0
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 2.34.101.3 255.255.255.0
 negotiation auto
!
router ospf 1
 router-id 10.0.0.2
 redistribute connected subnets
 network 2.1.0.0 0.0.255.255 area 1
 network 2.23.0.0 0.0.255.255 area 1
!
router bgp 2
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 neighbor from_one peer-group
 neighbor from_one remote-as 2
 neighbor from_three peer-group
 neighbor from_three remote-as 2
 neighbor 10.0.0.1 peer-group from_one
 neighbor 10.0.0.1 update-source Loopback0
 neighbor 10.0.0.3 peer-group from_three
 neighbor 10.0.0.3 update-source Loopback0
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  neighbor from_one send-community
  neighbor from_one route-map from_left in
  neighbor from_three send-community
  neighbor from_three route-map to_right out
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.3 activate
  maximum-paths eibgp 5
 exit-address-family
!
ip forward-protocol nd
!
ip bgp-community new-format
!
no ip http server
no ip http secure-server
!
ip community-list good_path permit 50:50
ip community-list check_10 permit 10:10
ip community-list check_20 permit 20:20
ip community-list check_30 permit 30:30
ip community-list check_40 permit 40:40
!
ip prefix-list checked-prefixes-1 seq 5 permit 2.4.0.0/16 ge 16
ip prefix-list checked-prefixes-2 seq 5 permit 3.9.0.0/16 ge 16
ip prefix-list checked-prefixes-3 seq 5 permit 4.16.0.0/16 ge 16
ip prefix-list checked-prefixes-4 seq 5 permit 5.25.0.0/16 ge 16
!
route-map from_left deny 100
 match ip address prefix-list checked-prefixes-1
!
route-map from_left permit 200
 match ip address prefix-list checked-prefixes-2
 set community 70:70 additive
!
route-map from_left deny 400
 match ip address prefix-list checked-prefixes-3
!
route-map from_left permit 400
 match ip address prefix-list checked-prefixes-4
 set community 90:90 additive
!
route-map from_left permit 500
!
route-map to_right permit 100
 match community good_path
 set community 100:100
!
route-map to_right permit 200
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end